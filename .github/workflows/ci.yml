# Continuous Integration for the Kelp Agency Clone.
#
# Runs on every push to `main` and every pull_request targeting `main`.
# Mirrors the local verification suite documented in AGENTS.md:
#   - npm run check        (astro check — TypeScript + .astro diagnostics)
#   - npm run build        (static build to dist/)
#   - npm run check:links  (static internal-link checker — runs after build)
#   - npm run check:content (frontmatter validator — runs any time)
#   - npm run test:e2e     (Playwright E2E — runs in the e2e job, in parallel)
#
# The `verify` job runs the static checks. The `e2e` job runs the Playwright
# suite (including the F1/F2/F3 View Transitions regression tests) in parallel.
# The e2e job caches the Playwright browser binary (~180 MB) to avoid
# re-downloading on every run.
#
# Per astro-7 §3266 (Testing section) and astro-7-patterns §16 (pre-build
# dep guard), this workflow relies on the `prebuild` and `precheck` npm
# lifecycle hooks to verify config-level dependencies before `astro build`
# and `astro check` run.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref — saves CI minutes when a
# contributor pushes multiple commits to a PR in quick succession.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: check + build + links + content
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Astro 7 requires Node.js 22.12.0+
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check (.astro + TypeScript)
        run: npm run check

      - name: Build static site
        run: npm run build

      - name: Check internal links
        run: npm run check:links

      - name: Check content frontmatter
        run: npm run check:content

      - name: Upload build artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e:
    name: Playwright E2E (regression suite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Run in parallel with the verify job — don't block on browser download.
    # The e2e job is required for merge (default GitHub branch protection
    # setting) so regressions are caught before they hit main.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browser (Chromium only)
        # Only Chromium — matches the two projects (desktop-chrome, mobile-chrome)
        # in playwright.config.ts. Installing all browsers would add ~150 MB.
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        # The webServer config in playwright.config.ts auto-builds + serves dist/
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

